name: Salud semanal

# Lunes a las 05:00 UTC y a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# Solo necesita escribir en el repositorio para subir mantenimiento/incidencias.md.
permissions:
  contents: write

concurrency:
  group: salud-semanal
  cancel-in-progress: false

jobs:
  salud:
    name: Revisar la salud de la web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Comprobar enlaces externos (lychee)
        id: lychee
        if: steps.build.outcome == 'success'
        uses: lycheeverse/lychee-action@v2
        with:
          # Solo enlaces http(s) externos; los internos ya los revisa «npm run check».
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude-loopback
            --exclude 'mi-web\.pages\.dev'
            --max-retries 3
            --timeout 30
            --accept '200..=299,403,429'
            'dist/**/*.html'
          output: lychee-out.md
          format: markdown
          fail: false
          jobSummary: true

      - name: Auditoría de seguridad de dependencias
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev 2>&1 | tee audit.txt; exit ${PIPESTATUS[0]}

      - name: Registrar incidencias si las hay
        env:
          BUILD: ${{ steps.build.outcome }}
          LYCHEE: ${{ steps.lychee.outputs.exit_code }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          problemas=0
          [ "$BUILD" != "success" ] && problemas=1
          [ -n "$LYCHEE" ] && [ "$LYCHEE" != "0" ] && problemas=1
          [ "$AUDIT" != "success" ] && problemas=1
          if [ "$problemas" = "0" ]; then
            echo "Sin incidencias: no se hace commit."
            exit 0
          fi

          fecha=$(TZ=Europe/Madrid date +%F)
          hora=$(TZ=Europe/Madrid date '+%H:%M')
          {
            echo ""
            echo "## $fecha $hora (hora de Madrid) · revisión semanal"
            echo ""
            echo "Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "$BUILD" != "success" ]; then
              echo "### ✗ La compilación ha fallado"
              echo '```'
              tail -n 40 build.log
              echo '```'
            else
              echo "- ✓ Compilación correcta"
            fi
            if [ -n "$LYCHEE" ] && [ "$LYCHEE" != "0" ]; then
              echo ""
              echo "### ✗ Enlaces externos rotos"
              cat lychee-out.md
            elif [ "$BUILD" = "success" ]; then
              echo "- ✓ Enlaces externos correctos"
            fi
            if [ "$AUDIT" != "success" ]; then
              echo ""
              echo "### ✗ Vulnerabilidades en dependencias (npm audit --omit=dev)"
              echo '```'
              tail -n 60 audit.txt
              echo '```'
            else
              echo "- ✓ Sin vulnerabilidades conocidas en dependencias de producción"
            fi
          } >> mantenimiento/incidencias.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mantenimiento/incidencias.md
          git commit -m "chore(salud): incidencias $fecha"
          git push origin HEAD:main
